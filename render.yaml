services:
  - type: web
    name: nusa-ai-pro
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: nusa-ai-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: nusa-ai-db
    plan: basic-256mb
